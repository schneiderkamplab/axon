[project]
name = "ettin-mlx"
version = "0.1.0"
description = "Ettin encoders and decoders (ModernBERT) implemented from scratch in MLX"
readme = "README.md"
authors = [
    { name = "williambrach", email = "wibrach@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub>=2.3.0",
    "mlx>=0.32.4",
    "numpy>=2.5.4",
    "tokenizers>=0.23.3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "torch>=2.15.0",
    "transformers>=5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not large'"
markers = ["large: opt-in parity runs on the 68m/150m/400m/1b checkpoints (select with -m large)"]
