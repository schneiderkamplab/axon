[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synapse"
version = "0.1.0"
authors = [
  { name = "Peter Schneider-Kamp" }
]

description = "Axon: a domain-specific language and compiler for neural network model definitions."
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    'accelerate',
    'lark',
    'mltiming',
    'numpy',
    'omegaconf',
    'pytest',
    'safetensors',
    'sentencepiece',
    'torch',
    'tiktoken',
    'tinygrad',
    'transformers>=5.5.0',
    'tqdm',
    'typer'
]

[project.optional-dependencies]
mlx = ["mlx"]
dev = ["build", "mypy", "pre-commit", "pytest-xdist", "ruff", "twine", "mlx"]

[project.urls]
"Homepage" = "https://github.com/schneiderkamplab/synapse"
"Bug Tracker" = "https://github.com/schneiderkamplab/synapse/issues"

[tool.hatch.build]
include = [
    'synapse',
    'synapse/builtins/*.axon',
    'synapse/builtins/static/*.axon',
    'synapse/models',
    'LICENSE',
    'README.md',
]

[project.scripts]
synapse = "synapse.cli.synapse:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
files = ["synapse"]
exclude = "^(tests/|examples/|test_.*\\.py$|axon\\.py$)"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = false
